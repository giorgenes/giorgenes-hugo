<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" data-theme="auto">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    {{ partial "navbar.html" . }}
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    <script>
      // Respect system preference; allow manual override stored in localStorage
      const stored = localStorage.getItem('theme');
      if (stored) document.documentElement.setAttribute('data-theme', stored);
    </script>
  </body>
</html>
